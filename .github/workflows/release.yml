name: Release process

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  bump:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests
      - name: Install bumpcalver
        shell: pwsh
        run: |
          pip install bumpcalver
      - name: Configure git user
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run bumpcalver to create version and tag
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bumpcalver --build --git-tag --auto-commit
      - name: Fetch tags
        shell: pwsh
        run: |
          git fetch --tags
      - name: Get latest tag
        id: set-tag
        shell: pwsh
        run: |
          $tag = git describe --tags --abbrev=0
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

  build-release:
    needs: bump
    runs-on: windows-latest
    if: needs.bump.outputs.tag != ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch --tags
      - name: Show tag
        run: echo "Release tag: ${{ needs.bump.outputs.tag }}"
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build exe (PyInstaller)
        shell: pwsh
        run: |
          .\build_exe.ps1
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ needs.bump.outputs.tag }}
          release_name: ${{ needs.bump.outputs.tag }}
          body: "Automated release for ${{ needs.bump.outputs.tag }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload release asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: dist/transfer_sd.exe
          asset_name: transfer_sd.exe
          asset_content_type: application/octet-stream
